name: Private Revenue Split CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '22.x'

jobs:
  # ─────────────────────────────────────────
  # Job 1: Type-check + Lint
  # ─────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────
  # Job 2: Verify Contract Address
  # ─────────────────────────────────────────
  verify-contract:
    name: Verify Deployed Contract Address
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and verify contract address
        run: |
          # Primary: read from src/config/network.ts (always tracked, single source of truth)
          CONTRACT_ADDR=$(grep -oP "(?<='0x)[0-9a-fA-F]{62,64}(?=')" src/config/network.ts | head -1)
          if [ -z "$CONTRACT_ADDR" ]; then
            # Fallback: try .contract-address file if present
            if [ -f .contract-address ]; then
              CONTRACT_ADDR=$(cat .contract-address | tr -d '[:space:]')
            fi
          else
            CONTRACT_ADDR="0x${CONTRACT_ADDR}"
          fi

          if [ -z "$CONTRACT_ADDR" ]; then
            echo "❌ Contract address not found in src/config/network.ts or .contract-address"
            exit 1
          fi

          echo "✅ Contract address: $CONTRACT_ADDR"
          echo "   Length: ${#CONTRACT_ADDR} characters"

          # Validate format: 0x prefix + 64 hex chars = 66 total
          if [[ ! "$CONTRACT_ADDR" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "❌ Address format invalid — expected 0x + 64 hex chars (66 total)"
            echo "   Got ${#CONTRACT_ADDR} chars: $CONTRACT_ADDR"
            exit 1
          fi

          echo "✅ Address format valid (0x + 64 hex = 66 chars)"

  # ─────────────────────────────────────────
  # Job 3: Unit Tests
  # ─────────────────────────────────────────
  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  # ─────────────────────────────────────────
  # Job 4: Production Build
  # ─────────────────────────────────────────
  build:
    name: Production Build & Artifact Upload
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────
  # Job 5: Security Audit
  # ─────────────────────────────────────────
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run npm Audit
        run: npm audit --audit-level=high || true
